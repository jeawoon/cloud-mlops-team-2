name: Appliance simulator tests

on:
  pull_request:
    paths:
      - 'energy-power-predictor/**'
      - '.github/workflows/appliance-tests.yml'
  push:
    branches: [main]
    paths:
      - 'energy-power-predictor/**'
      - '.github/workflows/appliance-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: energy-power-predictor
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: energy-power-predictor/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest test_appliance_plan test_laundry test_device_forecast test_verification test_api test_verification_ui test_improvements -v

  container-smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root application image
        run: docker build -f energy-power-predictor/deploy/Dockerfile -t energy-smoke:test energy-power-predictor
      - name: Check container API and Streamlit startup without publishing ports
        shell: bash
        run: |
          energy_smoke_token=$(openssl rand -hex 32)
          docker run --detach --name energy-smoke -e PREDICTION_API_TOKEN="$energy_smoke_token" energy-smoke:test
          for attempt in {1..30}; do
            if docker exec energy-smoke python deploy/healthcheck.py; then exit 0; fi
            sleep 2
          done
          docker logs --tail 40 energy-smoke
          exit 1
      - name: Remove temporary test container
        if: always()
        run: docker rm --force energy-smoke || true
