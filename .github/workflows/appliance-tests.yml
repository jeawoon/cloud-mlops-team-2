name: Appliance simulator tests

on:
  pull_request:
    paths:
      - 'energy-power-predictor/**'
      - '.github/workflows/appliance-tests.yml'
  push:
    branches: [main]
    paths:
      - 'energy-power-predictor/**'
      - '.github/workflows/appliance-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: energy-power-predictor
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: energy-power-predictor/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest test_appliance_plan test_laundry test_device_forecast test_verification test_api test_verification_ui -v
