name: energy-predictor
services:
  app:
    image: ${ENERGY_IMAGE:?Set a commit-tagged image}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      ENERGY_API_BIND: 0.0.0.0
      PREDICTION_API_TOKEN: ${PREDICTION_API_TOKEN:?Set service token}
      ENERGY_HISTORY_DB: /app/runtime-data/history.sqlite3
    ports:
      - '127.0.0.1:8501:8501'
      - '127.0.0.1:8000:8000'
    volumes:
      - history:/app/runtime-data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  history:
